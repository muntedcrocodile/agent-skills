<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project plan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body { margin: 0; background: #fafaf9; color: #1c1917; font-family: system-ui, sans-serif; line-height: 1.6; }
      main { max-width: 68rem; margin: auto; padding: 3rem 1.5rem; }
      a { color: #075985; }
      button, input, select { font: inherit; }
      :focus-visible { outline: 3px solid #0284c7; outline-offset: 4px; }
      @media print { body { background: white; } main { padding: 0; } }
    </style>
    <style type="text/tailwindcss">
      @theme { --color-accent: #075985; }
    </style>
  </head>
  <body>
    <main>
      <p class="text-sm font-semibold uppercase tracking-widest text-accent">Working plan</p>
      <h1 class="mt-4 text-4xl font-semibold tracking-tight sm:text-6xl">Project plan</h1>
      <p class="mt-6 max-w-2xl text-lg text-stone-600">Replace this example with the outcome, assumptions, and decisions for this task.</p>
      <section aria-labelledby="next-step" class="mt-12 border-t border-stone-300 pt-6">
        <h2 id="next-step" class="text-2xl font-semibold">Next step</h2>
        <p class="mt-3">Describe the concrete next action and its purpose.</p>
      </section>
    </main>
  </body>
</html>
