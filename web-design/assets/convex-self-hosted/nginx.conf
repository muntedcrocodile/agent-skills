worker_processes auto;
events { worker_connections 1024; }
http {
  server_tokens off;
  client_max_body_size 128m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # This listener must be reachable only by the trusted upstream proxy/local host.
  map $http_x_forwarded_proto $original_scheme { default $scheme; https https; http http; }
  server {
    listen 8081;
    location / {
      proxy_pass http://backend:3210;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $original_scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
  server {
    listen 8082;
    location / {
      proxy_pass http://backend:3211;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $original_scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }
  }
}
